<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>types of HTML</title>
</head>
<body>
    <!-- Paragrapgh elements -->
     <p>Hello
        World
        ABES
        x<sup>2</sup> + ax + b
     </p>
     <pre>
        Hello
        World
        ABES
     </pre>
     
     <em>
        Hello
     </em>

     

    <!-- block level Elements -->
    <div>Hello</div>
    <div>World</div>

    <!-- inline level elements -->
     <a href="https://www.google.com">Google link</a>
     <a href = "#">Other</a>
     <hr>
     <span>
        Mechanical
     </span>
     <br>
     <span>
        Engineering
    </span>
    <br>
    <b>Hello</b>
    <i>Hello</i>
    <u>Hello</u>
    <center>World</center>

    <font color ="#FF0000">Heil Hitler</font>


</body>
</html>
